name: CI

on:
  push:
  pull_request:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      # Ports of the local boards the Node tests start. The client tests also use the two ports after P2P_TEST_PORT.
      P2P_TEST_PORT: "8821"
      APP_TEST_PORT: "8841"
    steps:
      # Both actions are pinned to the full commit SHA of a release, so a moved tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install the Rust toolchain named in rust-toolchain.toml
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal
          rustc --version
          cargo --version

      - name: Build
        run: cargo build --locked

      - name: Rust tests
        run: cargo test --locked

      - name: Client tests
        run: node --test client-test/

      - name: Web view tests
        run: node --test app-test/

      # demo.sh plays its story on 127.0.0.1 in a temporary directory, from enrollment to a verify that must fail
      # with exit code 5. It exits non-zero when any step does not give the expected result.
      - name: Demo
        run: ./demo.sh
